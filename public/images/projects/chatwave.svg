  <circle cx="284" cy="184" r="14" fill="#34d399"/>
  <circle cx="442" cy="314" r="10" fill="#34d399"/>
  <circle cx="254" cy="446" r="8" fill="#34d399"/>
  <text x="330" y="710" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#bae6fd" font-weight="700" letter-spacing="2">CHATWAVE</text>
