  <rect x="880" y="532" width="80" height="26" rx="13" fill="#0e7490"/>
  <circle cx="905" cy="545" r="3" fill="#e0f2fe"/>
  <circle cx="920" cy="545" r="3" fill="#e0f2fe"/>
